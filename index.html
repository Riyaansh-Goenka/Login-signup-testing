<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            gap: 50px; 
            margin-top: 50px; 
            background: #f5f5f5; 
        }
        .form-box { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 300px; 
        }
        h2 { 
            margin-top: 0; 
            color: #333; 
        }
        .input-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #333;
        }
        input { 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
        }
        button:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>Create Account</h2>
        <form id="signup-form">
            <div class="input-group">
                <label for="signup-username">Username</label>
                <input type="text" id="signup-username" required placeholder="Choose a username">
            </div>
            <div class="input-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" required minlength="1" placeholder="At least 1 character">
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required placeholder="Re-enter password">
            </div>
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <div class="form-box">
        <h2>Log In</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" required placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required placeholder="Enter your password">
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>

    <script>

        function getUsers() {
            return JSON.parse(localStorage.getItem('registeredUsersByUsername')) || {};
        }

        // Handle Signup
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('signup-username').value.trim();
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // 1. Password Match Check
            if (password !== confirmPassword) {
                alert("Passwords do not match! Please enter them again.");
                document.getElementById('confirm-password').value = '';
                document.getElementById('confirm-password').focus();
                return;
            }

            const users = getUsers();

            // 2. Unique Username Check (Case-insensitive)
            const usernameExists = Object.keys(users).some(
                u => u.toLowerCase() === username.toLowerCase()
            );

            if (usernameExists) {
                alert('That username is already taken! Please choose another one.');
                return;
            }

            // 3. Register Account directly
            users[username] = {
                username: username,
                password: password,
                pfp: 'https://picsum.photos/200'
            };

            localStorage.setItem('registeredUsersByUsername', JSON.stringify(users));
            localStorage.setItem('currentUsername', username);

            alert('Account created successfully!');
            window.location.href = 'yabhb.html';
        });

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('login-username').value.trim();
            const passwordInput = document.getElementById('login-password').value;
            const users = getUsers();

            // Find user by exact Username
            const foundUsername = Object.keys(users).find(
                uname => uname.toLowerCase() === usernameInput.toLowerCase()
            );

            if (foundUsername && users[foundUsername].password === passwordInput) {
                localStorage.setItem('currentUsername', foundUsername);
                window.location.href = 'yabhb.html';
            } else {
                alert('Invalid username or password.');
            }
        });
    </script>

</body>
</html>
